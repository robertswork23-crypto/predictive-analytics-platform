version: '3.8'

services:
  ml-platform:
    build: .
    container_name: predictive-analytics-platform
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MODEL_VERSION=1.0.0
      - LOG_LEVEL=INFO
    volumes:
      - ml_data:/app/data
    networks:
      - ml_network

volumes:
  ml_data:

networks:
  ml_network:
    driver: bridge
