version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: predictive-analytics-platform-postgres
    restart: always
    environment:
      - POSTGRES_USER=mlplatform
      - POSTGRES_PASSWORD=mlplatform
      - POSTGRES_DB=predictive_analytics_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ml_network

  ml-platform:
    build: .
    container_name: predictive-analytics-platform
    restart: always
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://mlplatform:mlplatform@postgres:5432/predictive_analytics_platform
      - RETRAIN_INTERVAL_MINUTES=30
    volumes:
      - ml_model:/app
    networks:
      - ml_network

volumes:
  pg_data:
  ml_model:

networks:
  ml_network:
    driver: bridge
